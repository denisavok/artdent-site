<section class="reviews">
  <h2>Ce spun pacientii nostri</h2>

  <swiper-container
    slides-per-view="3"
    space-between="30"
    navigation="true"
    pagination="true"
    loop="true">

    <swiper-slide *ngFor="let review of reviews">
      <div class="review-card">
        <div class="stars">★★★★★</div>

        <p>"{{ review.text }}"</p>

        <strong>{{ review.name }}</strong>
      </div>
    </swiper-slide>

  </swiper-container>
</section>
