<section class="contact-page">

  <div class="container">

  <span class="eyebrow">
        ART DENT GROUP · CONTACT
  </span>
 

  <div class="container contact-container">

    <div class="contact-form">

      <h1>Contacteaza-ne</h1>

      <p>
        Completeaza formularul si te vom contacta pentru programare.
      </p>

      <form>

        <label for="name">Nume</label>
        <input
          type="text"
          id="name"
          name="name"
          placeholder="Numele tau">

        <label for="email">Email</label>
        <input
          type="email"
          id="email"
          name="email"
          placeholder="Emailul tau">

        <label for="phone">Telefon</label>
        <input
          type="tel"
          id="phone"
          name="phone"
          placeholder="Numarul de telefon">

        <label for="message">Mesaj</label>
        <textarea
          id="message"
          name="message"
          rows="5"
          placeholder="Mesajul tau"></textarea>

        <button type="submit">
          Trimite mesajul
        </button>

      </form>

    </div>

    <div class="contact-info">

      <h2>Ne gasesti</h2>

      <div class="contact-item">
        <h3>Locatie</h3>
        <p>Bucuresti, Romania</p>
      </div>

      <div class="contact-item">
        <h3>Telefon</h3>
        <p>0728 XXX XXX</p>
      </div>

      <div class="contact-item">
        <h3>Email</h3>
        <p>contact@artdent.ro</p>
      </div>

      <div class="contact-item">
        <h3>Program</h3>
        <p>
          Luni - Vineri: 09:00 - 18:00<br>
          Sambata: 09:00 - 14:00<br>
          Duminica: Inchis
        </p>
      </div>

    </div>

  </div>
  </div>
</section>
