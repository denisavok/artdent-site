<section class="appointment-page">

  <div class="container">

    <section class="appointment-hero">

      <div class="appointment-intro">
        <span class="eyebrow">ART DENT GROUP</span>

        <h1>
          Fa-ti o<br>
          <strong>programare.</strong>
        </h1>

        <p>
          Completeaza formularul, iar noi te vom contacta pentru
          confirmarea programarii.
        </p>
      </div>

      <div class="appointment-form-box">

        <span class="form-label">SOLICITA O PROGRAMARE</span>

        <form>

          <div class="form-row">

            <div class="form-group">
              <label for="name">Nume complet</label>
              <input
                id="name"
                type="text"
                placeholder="Numele tau"
              >
            </div>

            <div class="form-group">
              <label for="phone">Telefon</label>
              <input
                id="phone"
                type="tel"
                placeholder="Numarul de telefon"
              >
            </div>

          </div>

          <div class="form-group">
            <label for="email">Email</label>
            <input
              id="email"
              type="email"
              placeholder="Adresa de email"
            >
          </div>

          <div class="form-group">
            <label for="service">Serviciu</label>

            <select id="service">
              <option value="">Alege un serviciu</option>
              <option>Igiena si profilaxie</option>
              <option>Terapie dentara</option>
              <option>Endodontie</option>
              <option>Chirurgie dentara</option>
              <option>Consultatie</option>
              <option>Altele</option>
            </select>
          </div>

          <div class="form-row">

            <div class="form-group">
              <label for="date">Data dorita</label>
              <input
                id="date"
                type="date"
              >
            </div>

            <div class="form-group">
              <label for="time">Ora dorita</label>
              <input
                id="time"
                type="time"
              >
            </div>

          </div>

          <div class="form-group">
            <label for="message">Mesaj</label>
            <textarea
              id="message"
              rows="4"
              placeholder="Scrie aici, daca ai informatii suplimentare..."
            ></textarea>
          </div>

          <button type="submit" class="submit-button">
            Trimite solicitarea
            <span>→</span>
          </button>

        </form>

      </div>

    </section>

  </div>

</section>
